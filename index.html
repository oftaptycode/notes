<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13171a" />
  <title>Notes</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="list-pane">
      <header id="list-header">
        <input id="search" type="search" placeholder="Search notes" autocomplete="off" />
        <button id="new-note" aria-label="New note" title="New note">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <div id="auth-bar">
        <span id="sync-dot" title="Sync status"></span>
        <span id="sync-label"></span>
        <span id="auth-user"></span>
        <button id="auth-btn">Sign in</button>
      </div>
      <form id="auth-form" hidden>
        <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
        <div id="auth-error"></div>
        <div>
          <button id="auth-signin" type="submit">Sign in</button>
          <button id="auth-signup" type="button">Sign up</button>
          <button id="auth-close" type="button">Cancel</button>
        </div>
      </form>
      <div id="list-scroll">
        <div id="list-spacer"></div>
        <div id="list-rows"></div>
      </div>
    </aside>
    <main id="editor-pane">
      <div class="note-lava" aria-hidden="true">
        <div class="lava-blob lava-blob-one"></div>
        <div class="lava-blob lava-blob-two"></div>
        <div class="lava-blob lava-blob-three"></div>
      </div>
      <header id="editor-header">
        <button id="back" aria-label="Back to notes">&larr; Notes</button>
        <span id="save-state"></span>
        <button id="export-note">Export</button>
        <button id="delete-note">Delete</button>
      </header>
      <div id="editor"></div>
      <footer id="note-footer" hidden>
        <details id="note-details">
          <summary id="note-summary" title="Show or hide mood probabilities">
            <span class="note-summary-text">
              <time id="note-created"></time>
              <span id="note-mood" role="status" aria-live="polite" aria-atomic="true" hidden></span>
            </span>
            <svg class="note-summary-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </summary>
          <div id="note-mood-probabilities" hidden></div>
        </details>
      </footer>
    </main>
  </div>
  <dialog id="delete-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
    <form method="dialog">
      <div class="dialog-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6" />
        </svg>
      </div>
      <h2 id="delete-dialog-title">Delete note?</h2>
      <p class="dialog-note">“<span id="delete-dialog-note"></span>”</p>
      <p id="delete-dialog-description">This note will be removed. You can’t undo this action.</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" autofocus>Cancel</button>
        <button type="submit" value="delete" class="danger-button">Delete note</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
